name: 신펫 자동 동기화

on:
  schedule:
    # 매주 월요일 00:00 UTC (한국시간 월요일 09:00)
    - cron: "0 0 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: self-hosted  # ohrsa.net이 GitHub 호스팅 러너 IP대역을 막아서 자체 러너(사용자 WSL)로 실행
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: 펫 목록 확인 및 계산
        id: sync
        env:
          OHRSA_ID: ${{ secrets.OHRSA_ID }}
          OHRSA_PW: ${{ secrets.OHRSA_PW }}
        run: python scripts/sync.py

      - name: 변경사항 커밋 & 푸시
        if: steps.sync.outputs.has_new == 'true'
        run: |
          git config user.name "stoneage-calc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/pets.json index.html summary.json
          MSG=$(python3 - <<'PYEOF'
          import json
          s = json.load(open("summary.json", encoding="utf-8"))
          names = ", ".join(p["name"] for p in s["added"])
          title = f"chore: 신펫 {len(s['added'])}마리 자동 반영" if s["added"] else "chore: 펫 데이터 동기화"
          print(title + (f" ({names})" if names else ""))
          PYEOF
          )
          git commit -m "$MSG"
          git push

      - name: 동기화 결과 이슈 등록
        if: steps.sync.outputs.has_new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY_FILE=$(mktemp)
          python3 - <<'PYEOF' > "$BODY_FILE"
          import json
          s = json.load(open("summary.json", encoding="utf-8"))
          lines = [f"전체 확인 {s['checked_total']}마리 기준 동기화 결과입니다.", ""]

          if s["added"]:
              lines.append(f"### 신규 추가 {len(s['added'])}마리")
              for p in s["added"]:
                  status = "근사치" if p["approx"] else ("미지원" if not p["ok"] else "정밀")
                  lines.append(f"- {p['name']} (id {p['id']}) — {status}")
              lines.append("")

          if s["needs_review"]:
              lines.append("### ⚠ 확인 필요 (원본계수 역산이 깔끔하지 않음)")
              for p in s["needs_review"]:
                  lines.append(f"- **{p['name']}** (id {p['id']}) — {p['status']} · 성장률 {p['growth_S']} · 초기치 {p['init_S']}")
              lines.append("")

          if s["changed_existing"]:
              lines.append("### ⚠ 기존 펫 표기값 변경 감지 (자동 반영 안 함, 수동 확인 필요)")
              for p in s["changed_existing"]:
                  lines.append(f"- {p['name']} (id {p['id']})")
              lines.append("")

          if s.get("replaced_manual"):
              lines.append("### 수동 등록 펫 정식 전환")
              for p in s["replaced_manual"]:
                  lines.append(f"- {p['name']} ({p['old_id']} -> {p['new_id']})")
              lines.append("")

          if s.get("attrs_refreshed_names"):
              names = s["attrs_refreshed_names"]
              lines.append(f"### 속성(지수화풍) 수치 갱신 {len(names)}마리")
              lines.append(", ".join(names))
              lines.append("")

          if s.get("order_changed") and not (s["added"] or s.get("replaced_manual")):
              lines.append("### 목록 순서만 사이트 기준으로 재정렬됨")

          print("\n".join(lines))
          PYEOF
          gh issue create \
            --title "펫 데이터 동기화 결과 ($(date +%Y-%m-%d))" \
            --body-file "$BODY_FILE"
