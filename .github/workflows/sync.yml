name: 신펫 자동 동기화

on:
  schedule:
    # 매주 월요일 00:00 UTC (한국시간 월요일 09:00)
    - cron: "0 0 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: self-hosted  # ohrsa.net이 GitHub 호스팅 러너 IP대역을 막아서 자체 러너(사용자 WSL)로 실행
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: 펫 목록 확인 및 계산
        id: sync
        env:
          OHRSA_ID: ${{ secrets.OHRSA_ID }}
          OHRSA_PW: ${{ secrets.OHRSA_PW }}
        run: python scripts/sync.py

      - name: 변경사항 커밋 & 푸시
        if: steps.sync.outputs.has_new == 'true'
        run: |
          git config user.name "stoneage-calc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/pets.json index.html summary.json
          MSG=$(python3 - <<'PYEOF'
          import json
          s = json.load(open("summary.json", encoding="utf-8"))
          names = ", ".join(p["name"] for p in s["added"])
          title = f"chore: 신펫 {len(s['added'])}마리 자동 반영" if s["added"] else "chore: 펫 데이터 동기화"
          print(title + (f" ({names})" if names else ""))
          PYEOF
          )
          git commit -m "$MSG"
          git push

      - name: 동기화 결과 이슈 등록
        if: steps.sync.outputs.has_new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/create_sync_issue.py
